<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>高速道路マップ(試作)</title>
<link rel="stylesheet" href="./vendor/maplibre-gl.css">
<style>
  html,body{margin:0;height:100%;font:13px/1.4 system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;color:#222}
  #map{position:absolute;inset:0}
  #panel{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);border-radius:8px;
    padding:8px 12px;box-shadow:0 1px 6px rgba(0,0,0,.25);z-index:2;max-width:220px}
  #panel b{display:block;margin-bottom:4px}
  #panel label{display:block;cursor:pointer;padding:1px 0}
  #panel .z{margin-top:4px;color:#666;font-size:12px}
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>高速道路マップ(試作)</b>
  <label><input type="checkbox" id="t-fac" checked> 施設ラベル</label>
  <label><input type="checkbox" id="t-names" checked> 道路名</label>
  <label><input type="checkbox" id="t-urban" checked> 都市高速</label>
  <label><input type="checkbox" id="t-grey" checked> 未開通区間</label>
  <div class="z">ズーム <span id="zoom"></span></div>
</div>
<script src="./vendor/maplibre-gl.js"></script>
<script src="./config.js"></script>
<script src="./main.js"></script>
</body>
</html>
